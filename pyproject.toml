[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "twopm"
version = "0.1.0"
description = "Differentiable two-process sleep model for Bayesian parameter recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arviz==0.23.4",
    "diffrax==0.7.0",
    "equinox==0.13.8",
    "jax==0.6.2",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "numpyro==0.19.0",
    "optimistix==0.0.10",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "scipy==1.15.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer AD/FD audits at the live design horizon (excluded from default CI)",
]
